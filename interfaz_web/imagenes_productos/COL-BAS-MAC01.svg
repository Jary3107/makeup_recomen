<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" width="100%" height="100%">
    <defs>
        <radialGradient id="studioBg" cx="50%" cy="42%" r="65%">
            <stop offset="0%" stop-color="#ede6e1"/>
            <stop offset="100%" stop-color="#c7b2a3"/>
        </radialGradient>
        <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c99b78"/>
            <stop offset="100%" stop-color="#9e7150"/>
        </linearGradient>
    </defs>
    <!-- Fondo de Estudio Fotográfico -->
    <rect width="400" height="310" fill="url(#studioBg)"/>
    <!-- Pedestal de estudio cosmético -->
    <ellipse cx="200" cy="284" rx="126" ry="18" fill="rgba(255,255,255,0.45)"/>
    <!-- Muestra de textura / Swatch del tono a la derecha -->
    <circle cx="326" cy="236" r="28" fill="#bf8e68" stroke="#ffffff" stroke-width="3"/>
    <text x="326" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#3a2830">TONO REAL</text>
    
        <!-- Sombra de estudio -->
        <ellipse cx="200" cy="282" rx="68" ry="12" fill="rgba(0,0,0,0.22)" />
        <!-- Cuerpo de vidrio esmerilado de la base -->
        <rect x="146" y="102" width="108" height="172" rx="14" fill="url(#bottleGrad)" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
        <!-- Brillo lateral de estudio -->
        <rect x="154" y="108" width="14" height="158" rx="6" fill="rgba(255,255,255,0.38)"/>
        <!-- Cuello y dispensador pump -->
        <rect x="176" y="84" width="48" height="20" rx="4" fill="#2a2627"/>
        <rect x="166" y="34" width="68" height="54" rx="10" fill="#161415" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        <rect x="174" y="38" width="10" height="44" rx="4" fill="rgba(255,255,255,0.22)"/>
        <!-- Etiqueta frontal -->
        <rect x="158" y="138" width="84" height="98" rx="8" fill="rgba(255,255,255,0.82)"/>
        <text x="200" y="164" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#181014" letter-spacing="2">M·A·C</text>
        <text x="200" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#8c1d35" letter-spacing="1">STUDIO FIX</text>
        <text x="200" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="7.5" fill="#4a3a40">FLUID SPF 15 · 24HR</text>
        
</svg>