        <!-- Cuerpo del tubo cosmético -->
        <polygon points="138,54 262,54 240,238 160,238" fill="url(#bottleGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
        <rect x="138" y="42" width="124" height="14" rx="4" fill="#9f7253"/>
        <text x="200" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1d1417" letter-spacing="2">HUDA BEAUTY</text>
        <text x="200" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e5c19b" letter-spacing="1.2">EASY BLUR</text>
        <text x="200" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1d1417">NIACINAMIDE FOUNDATION</text>
        
