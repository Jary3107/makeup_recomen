<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 310" width="100%" height="100%">
    <defs>
        <radialGradient id="studioBg" cx="50%" cy="42%" r="65%">
            <stop offset="0%" stop-color="#f4e6df"/>
            <stop offset="100%" stop-color="#d4b2a2"/>
        </radialGradient>
        <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#cca080"/>
            <stop offset="100%" stop-color="#9f7253"/>
        </linearGradient>
    </defs>
    <!-- Fondo de Estudio Fotográfico -->
    <rect width="400" height="310" fill="url(#studioBg)"/>
    <!-- Pedestal de estudio cosmético -->
    <ellipse cx="200" cy="284" rx="126" ry="18" fill="rgba(255,255,255,0.45)"/>
    <!-- Muestra de textura / Swatch del tono a la derecha -->
    <circle cx="326" cy="236" r="28" fill="#c29372" stroke="#ffffff" stroke-width="3"/>
    <text x="326" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#3a2830">TONO REAL</text>
    
        <ellipse cx="200" cy="284" rx="58" ry="11" fill="rgba(0,0,0,0.24)" />
        <!-- Tapa inferior del tubo -->
